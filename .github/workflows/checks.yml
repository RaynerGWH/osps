name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check server and persistence
        run: python3 -B -m unittest discover -s tests -v
      - name: Check browser code
        run: |
          node --check static/app.js
          node --test tests/test_client.mjs
      - name: Check deployment script
        run: sh -n start.sh
